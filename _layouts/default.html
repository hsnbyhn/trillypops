<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<style>
:root{--bg:#fbf8f4;--fg:#2a2420;--muted:#6b6058;--link:#7a3f9d;--rule:#e8e0d6}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#f1ebe4;--muted:#b3a89d;--link:#d3a6f0;--rule:#3a332d}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:1.8em;line-height:1.2;margin:0 0 .6em}
h2{font-size:1.25em;margin:1.8em 0 .5em}
a{color:var(--link)}
footer{max-width:680px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.9em;border-top:1px solid var(--rule)}
footer p{margin-top:16px}
</style>
</head>
<body>
<main>
{{ content }}
</main>
<footer><p><a href="{{ '/' | relative_url }}">Trillypops</a> · <a href="{{ '/support/' | relative_url }}">Support</a> · <a href="{{ '/privacy/' | relative_url }}">Privacy</a></p></footer>
</body>
</html>
